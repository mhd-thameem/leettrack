# H2 database file lives in ./data/leettrack — survives restarts
spring.datasource.url=jdbc:h2:file:./data/leettrack
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Automatically creates/updates DB tables from our @Entity classes
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# H2's web-based database viewer, available at /h2-console when app is running
spring.h2.console.enabled=true
JWT_SECRET=local-dev-secret-key-change-this-in-real-life-12345
